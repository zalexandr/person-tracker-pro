request_location:
  name: Request location
  description: Refresh all configured location sources and recalculate presence.
  fields:
    entry_id:
      name: Config entry
      description: Optional Person Tracker PRO config entry ID.
      required: false
      selector:
        text:

recalculate_presence:
  name: Recalculate presence
  description: Recalculate the fused presence state immediately.
  fields:
    entry_id:
      name: Config entry
      required: false
      selector:
        text:

set_privacy_mode:
  name: Set privacy mode
  description: Change the runtime location privacy mode.
  fields:
    mode:
      name: Mode
      required: true
      selector:
        select:
          options:
            - full
            - zone_only
            - private
    entry_id:
      name: Config entry
      required: false
      selector:
        text:
